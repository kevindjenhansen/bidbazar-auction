<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="BidBazar is an auction platform where users can browse listings, create auctions, and place bids."
  />

  <title>BidBazar</title>

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" type="image/png" href="./assets/logo/bidbazar-logo.png" />
</head>

<body class="min-h-screen bg-gray-100 text-gray-900">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="./index.html" class="flex items-center gap-3">
        <img
          src="./assets/logo/bidbazar-logo.png"
          alt="BidBazar logo"
          class="h-10 w-10 object-contain"
        />

        <div>
          <p class="text-lg font-bold text-gray-950">BidBazar</p>
          <p class="text-xs font-semibold uppercase tracking-wider text-blue-700">
            Online Auctions
          </p>
        </div>
      </a>

      <div id="userHeader" class="flex items-center gap-3">
        <!-- Header content is rendered by js/header.js -->
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    <section class="mb-8 border-b border-gray-200 pb-8">
      <div class="flex flex-col justify-between gap-5 md:flex-row md:items-end">
        <div>
          <h1 class="text-4xl font-bold tracking-tight text-gray-950 md:text-5xl">
            Browse auctions
          </h1>

          <p class="mt-3 max-w-2xl text-base leading-7 text-gray-600">
            Search active listings, filter by tag, and place bids on items from other users.
          </p>
        </div>

        <a
          href="./html/listings/createListing.html"
          class="inline-flex w-fit items-center justify-center rounded-md bg-blue-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-blue-800 hover:shadow-md focus:outline-none focus:ring-4 focus:ring-blue-100"
        >
          + Create Listing
        </a>
      </div>
    </section>

    <section id="auctions">
      <div class="mb-6 rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
        <div class="grid gap-3 md:grid-cols-[180px_1fr_auto_auto]">
          <label class="sr-only" for="tagFilter">Filter by tag</label>
          <select
            id="tagFilter"
            class="rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 focus:border-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-100"
          >
            <option value="">All Tags</option>
          </select>

          <label class="sr-only" for="searchInput">Search auctions</label>
          <input
            id="searchInput"
            type="search"
            placeholder="Search auctions..."
            class="rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:border-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-100"
          />

          <button
            id="searchBtn"
            type="button"
            class="rounded-md bg-blue-700 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-100"
          >
            Search
          </button>

          <button
            id="activeBtn"
            type="button"
            class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-semibold text-gray-700 transition hover:border-blue-600 hover:text-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-100"
          >
            Active Only
          </button>
        </div>
      </div>

      <div
        id="auctionGrid"
        class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"
      ></div>

      <div
        id="pagination"
        class="mt-8 flex flex-wrap justify-center gap-2"
      ></div>
    </section>
  </main>

  <footer class="mt-10 border-t border-gray-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-2 px-4 py-6 text-sm text-gray-500 sm:flex-row sm:items-center sm:justify-between">
      <p>© 2025 BidBazar</p>
      <p>HTML, JavaScript, and Tailwind CSS</p>
    </div>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
